---
Protocol Name: DPV, OPV and CV Stability of Posolytes
Steps:
  # Step 1 of the experiment, DPV
  DPV:
    task: measure
    technique: DPV
    parameters:
      TechniqueParameters:
        Initial Voltage:
          value: 1.4
        Final Voltage:
          value: 0
    update_parameters: []
    analysis_settings:
      Plot:
        title: Differential Pulse Voltammetry
      Peak Picking: {}
      CV Parameters:
        filters:
        - key: peak
          operation: x > 0.0
        - key: rel_shape_factor
          operation: x > 0.1
        selection:
          key: peak
          operation: max(x)
  # Step 2 of the experiment, OCV
  OCV:
    task: measure
    technique: OCV
    parameters:
      TechniqueParameters:
        Voltage Interval Size:
          value: 0.1
        Time Interval Size:
          value: 0.05
        Rest Time:
          value: 10
    update_parameters: []
    analysis_settings:
      Plot:
        title: Open Circuit Voltammetry
      Voltage: {}
  # Step 3 of the experiment, CV scans
  CV:
    task: measure
    technique: CV
    parameters:
      TechniqueParameters:
        Voltage Profile:
          value: [0.0, 0.6, 0.0, 0.0, 0.0]  #  [V_init, V_max, V_min, V_init, V_fin]
        Number of Cycles:
          value: 5
        Scan Rate:
          value: [0.05, 0.05, 0.05, 0.05, 0.05]
        Voltage vs OCV:
          value: [true, false, false, true, false]
    update_parameters:
    - parameter: Voltage Profile # Update the voltage profile from the DPV scan results
      from measurement: DPV
      key: CV Parameters
    - parameter: Voltage Profile # Update the voltage profile from the OCV scan results
      from measurement: OCV
      key: CV Parameters
    analysis_settings:
      Plot:
        title: Cyclic Voltammetry
      Peak Picking: {}
      Integration: {}
Sample Volume: 1
Total Volume: 5
Discard Sample: false
Purge: 30
Wash:
  wash_volume: 5
  washing_cycles: 2
