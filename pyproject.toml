[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etoad"
version = "0.4.7"
description = "A Python package for automated experimentation for electroanalytical techniques."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Felix Strieth-Kalthoff", email = "f.striethkalthoff@utoronto.ca"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib==3.5.3",
    "modbus_tk==1.1.2",
    "numpy==1.23.2",
    "pandas==1.4.3",
    "Pillow==9.2.0",
    "pyserial==3.5",
    "PyYAML==6.0.0",
    "python-dotenv==0.21.0",
    "matterlab-serial-device==0.0.0",
    "matterlab-pumps>=1.0.0",
    "scipy==1.9.0",
    "setuptools==65.3.0",
    "slackclient==2.9.4",
]

[tool.setuptools.packages.find]
where = ["src"]